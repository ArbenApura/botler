<!doctype html>
<html lang="en" data-mode="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- THE BROWSER PAINTS ITS OWN CANVAS UNTIL THE STYLESHEET ARRIVES, SO THE MODE IS TOLD HERE BEFORE ANY FILE LOADS. THE TOKENS TAKE OVER FROM THERE -->
		<style>
			html[data-mode='dark'] {
				color-scheme: dark;
			}
			html[data-mode='light'] {
				color-scheme: light;
			}
		</style>
		<script>
			// The mode follows the system until a person chooses; the choice is stored in this browser only
			try {
				var saved = localStorage.getItem('botler-mode');
				var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.setAttribute(
					'data-mode',
					saved === 'dark' || saved === 'light' ? saved : dark ? 'dark' : 'light'
				);
			} catch (_) {
				/* Keep the default light mode */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
